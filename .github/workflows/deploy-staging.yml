name: deploy-staging

# Try a branch on staging before merging it: push it to the staging branch
# (git push -f origin my-branch:staging) or run this workflow with its ref.
# Merges to main reach staging (and then production) through the deploy workflow.
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, SHA or refs/pull/<n>/head to deploy to staging
        required: true

permissions:
  contents: read

# One branch deploy at a time; a newer request waits instead of interrupting a deploy.
# Deploys from every workflow also wait for each other on the host itself.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The staging environment is the only identity Google Cloud trusts for this deployer.
    environment:
      name: staging
      url: https://app.staging.tin.computer
    # No write token here: the branch's code is packaged in this job.
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # The scripts that run as root on the host come from main, never from the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: release
          persist-credentials: false
      - id: release
        run: echo "sha=$(git -C release rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy
        env:
          TIN_LITE_DEPLOY_TARGET: staging
          TIN_LITE_GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          TIN_LITE_STATIC_IP: ${{ vars.STAGING_STATIC_IP }}
          TIN_LITE_RELEASE_SOURCE: ${{ github.workspace }}/release
        run: bash trusted/infra/deploy.sh

  # The required "staging" check on main: this exact commit ran on staging. Testing it there,
  # and saying what was tested in the pull request, is up to its author. This job runs no
  # branch code, so the status token never reaches it.
  mark:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST "repos/${REPO}/statuses/${SHA}" \
            -f state=success -f context=staging \
            -f description="Deployed to staging by ${ACTOR}; test it there before merging" \
            -f target_url=https://app.staging.tin.computer
