name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR commits need no more runner time; main checks must finish independently.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tin_test
          POSTGRES_PASSWORD: tin_test
          POSTGRES_DB: tin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TIN_LITE_TEST_DATABASE_DSN: postgresql://tin_test:tin_test@127.0.0.1:5432/tin_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:diagrams
      - run: npm run check:comparison
      - run: npx playwright install --with-deps chromium
      - run: npm run test:raw-file-security
      - run: npm run test:fonts-browser
      - run: npm run test:diagrams-browser
      - run: npm run test:diagram-viewport
      - run: node --test scripts/check_diagram.test.mjs
      - run: npm run test:json-viewer
      - run: npm run test:comparison-browser
      - run: npm run test:content-plan-browser
      - run: npm run test:billing-browser
      - run: npm run test:run-payment-card-browser
      - run: npm run test:style-browser
      - run: npm run test:content-draft-browser
      - run: npm run test:content-delivery-browser
      - run: npm run test:workflow-review-browser
      - run: npm run test:auth-browser
      - run: npm run test:lock-page-browser
      - run: npm run test:project-menu-browser
      - run: npm run test:chat-browser
      - run: npm run test:connections-browser
      - run: node --test web/code-workflow.browser.test.js
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run lint-imports

  # Fast package feedback; the full verify job remains required before merging.
  contributions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run tin-lite validate-community
