name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR commits need no more runner time; main checks must finish independently.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that only change workflow packages skip the browser suite.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ github.event_name == 'push' || steps.filter.outputs.browser == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            browser:
              - "**"
              - "!workflow_packages/**"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run lint-imports

  # The Python tests in four parallel shards; tests/conftest.py splits them by TEST_SHARD.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tin_test
          POSTGRES_PASSWORD: tin_test
          POSTGRES_DB: tin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TIN_LITE_TEST_DATABASE_DSN: postgresql://tin_test:tin_test@127.0.0.1:5432/tin_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest -n auto --durations=15
        env:
          TEST_SHARD: ${{ matrix.shard }}

  # The browser tests in parallel: the web tests in three shards (node --test-shard splits the
  # files), and the extension's suites on their own. Nothing here installs from apt: the
  # runner image already has Chromium's libraries, and a slow Ubuntu mirror stalled apt past
  # the job limit (main, 0c3569fc, both attempts). A test that hangs fails by name after the
  # per-test timeout in package.json.
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: ["1/3", "2/3", "3/3", "extension"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # Node 24 times out a hung test by name; Node 22 applies --test-timeout to a whole file.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The bundle checks run once, beside the extension's suites, the shortest part.
      - if: matrix.part == 'extension'
        run: npm run check:diagrams
      - if: matrix.part == 'extension'
        run: npm run check:comparison
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        timeout-minutes: 3
      # The film kit's sketches and takes encode with ffmpeg: a pinned static build from a
      # GitHub release, checked against its digest.
      - if: matrix.part != 'extension'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-b6.0-linux-x64
      - if: matrix.part != 'extension'
        timeout-minutes: 2
        run: |
          dir="$HOME/.cache/ffmpeg-static"
          if [ ! -x "$dir/ffmpeg" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 3 --max-time 60 -o "$dir/ffmpeg.gz" \
              https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64.gz
            echo "17c1ae10b52ac499180679fe6ba77e17642390c4eedb0f1e3b0ac045da55128f  $dir/ffmpeg.gz" | sha256sum -c -
            gunzip "$dir/ffmpeg.gz"
            chmod +x "$dir/ffmpeg"
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -version | head -1
      - if: matrix.part != 'extension'
        run: npm run test:web
        env:
          TEST_SHARD: ${{ matrix.part }}
      - if: matrix.part == 'extension'
        run: npm run test:extension

  # The required status check; a skipped browser job counts as passed.
  verify:
    needs: [lint, python, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "lint: ${{ needs.lint.result }}, python: ${{ needs.python.result }}, browser: ${{ needs.browser.result }}"
          exit 1
      - run: echo "lint, python and browser checks passed"

  # Fast package feedback; the full verify job remains required before merging.
  contributions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run tin-lite validate-community
      - run: uv run python -m tin_lite.workflow_qualification_cli check workflow_packages/example.csv_summary/workflow.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test .github/scripts/contributor-gate.test.mjs
