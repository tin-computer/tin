name: contributor-gate

# Outside workflow pull requests must come from a Tin user who ran the package on a real
# project (docs/contributing-workflows.md). pull_request_target runs the base branch's copy
# of this workflow and script with a write token, so it must never check out, build or run
# the pull request's code: the script only reads the pull request through the API.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: contributor-gate-${{ github.event.pull_request.number }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The base branch, never the pull request head.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        env:
          TIN_CONTRIBUTOR_CHECK_URL: ${{ vars.TIN_CONTRIBUTOR_CHECK_URL }}
          TIN_CONTRIBUTOR_CHECK_TOKEN: ${{ secrets.TIN_CONTRIBUTOR_CHECK_TOKEN }}
        with:
          script: |
            const { gate } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contributor-gate.mjs`);
            core.setOutput("result", await gate({ github, context, core }));
