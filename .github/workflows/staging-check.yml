name: staging-check

# Sets the required "staging" status on a pull request's head commit. A change to the
# running service stays pending until that exact commit is deployed to staging
# (deploy-staging marks it). Changes that cannot affect the service pass here.
#
# pull_request_target so fork pull requests can receive a status. This job never checks out
# or runs pull request code; it only reads the list of changed paths.
#
# Run by hand, a maintainer (PROD_DEPLOYERS) marks a commit that was tested on staging another
# way, such as an infra/ change deployed with its own deploy.sh. The reason is recorded on the
# status. Statuses set from a personal account do not count: main requires this app's status.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of the pull request's head commit
        required: true
      reason:
        description: How it was tested on staging
        required: true

permissions:
  contents: read

jobs:
  staging:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "${NUMBER}" =~ ^[0-9]+$ && "${SHA}" =~ ^[0-9a-f]{40}$ ]]
          # Paths that never reach the running service.
          exempt='^(docs/|tests/|workflow_evals/|\.github/(pull_request_template\.md|review-replies\.md|CODEOWNERS)$|[^/]+\.md$|LICENSE$)|(^|/)tests/|\.test\.(js|cjs|mjs)$'
          service="$(gh api --paginate "repos/${REPO}/pulls/${NUMBER}/files" --jq '.[].filename' |
            grep -vE "${exempt}" || true)"
          if [[ -z "${service}" ]]; then
            gh api --method POST "repos/${REPO}/statuses/${SHA}" -f state=success \
              -f context=staging -f description="No change to the running service"
            exit 0
          fi
          current="$(gh api "repos/${REPO}/commits/${SHA}/status" \
            --jq '[.statuses[] | select(.context == "staging")][0].state // ""')"
          if [[ "${current}" != "success" ]]; then
            gh api --method POST "repos/${REPO}/statuses/${SHA}" -f state=pending \
              -f context=staging \
              -f description="Deploy this commit to staging and test it (deploy-staging)"
          fi

  attest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          REASON: ${{ inputs.reason }}
          TRIGGERED_BY: ${{ github.triggering_actor }}
          PROD_DEPLOYERS: ${{ vars.PROD_DEPLOYERS }}
        run: |
          set -euo pipefail
          if [[ ",${PROD_DEPLOYERS}," != *",${TRIGGERED_BY},"* ]]; then
            echo "${TRIGGERED_BY} is not in PROD_DEPLOYERS; only maintainers mark staging by hand" >&2
            exit 1
          fi
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "a full commit SHA is required" >&2; exit 1; }
          description="${TRIGGERED_BY}: ${REASON}"
          gh api --method POST "repos/${REPO}/statuses/${SHA}" -f state=success \
            -f context=staging -f description="${description:0:140}"
